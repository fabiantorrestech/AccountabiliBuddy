# The sealed relay (ADR 46). From this folder:  docker compose up -d --build
# Pinned mode (default): the relay makes a self-signed certificate on the first run. Read the address + pin line with
#   docker compose logs relay
# Behind a reverse proxy on the same machine (Caddy, see Caddyfile): swap in the "proxy" settings below. The relay only
# listens on 127.0.0.1 in that mode, so the container shares the host's network.

services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
    image: accountabilibuddy-relay
    restart: unless-stopped
    volumes:
      - relay-data:/data
    # Docker publishes this port itself, around ufw and most host firewalls: in this mode 8743 IS open to every network the
    # machine is on, whatever "ufw status" says. Behind Caddy use the proxy mode below, which publishes nothing.
    ports:
      - "8743:8743"
    # Proxy mode instead (delete "ports" above, then uncomment these two lines):
    # network_mode: host
    # command: ["--proxy"]
    # Optional: a personal relay holds a handful of groups (default 16); lower it to stop strangers filling it. There is only
    # ONE "command:" line: to use both, replace the line above with the combined form (a second "command:" key would silently
    # replace the first, and the relay would start in pinned mode on 0.0.0.0 instead of behind the proxy):
    # command: ["--proxy", "--max-groups", "4"]
    # Pinned mode with a lower cap instead:  command: ["--max-groups", "4"]

volumes:
  relay-data:
